<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Auto Zoom</h1>
    <label class="switch"><input type="checkbox" id="enabled"><span></span></label>
  </header>

  <section>
    <div class="label">Modo</div>
    <label class="opt"><input type="radio" name="mode" value="zoom"><div><b>Zoom</b><small>Rellena la pantalla sin deformar (recorta bordes)</small></div></label>
    <label class="opt"><input type="radio" name="mode" value="stretch"><div><b>Estirar</b><small>Rellena todo estirando la imagen (deforma)</small></div></label>
    <label class="opt"><input type="radio" name="mode" value="fit"><div><b>Ajustar</b><small>Solo quita barras sin recortar ni deformar</small></div></label>
  </section>

  <section>
    <div class="label">Intensidad <span id="sv">100%</span></div>
    <input type="range" id="strength" min="0" max="100" step="5">
    <div class="label">Zoom máximo <span id="mv">2.5x</span></div>
    <input type="range" id="maxZoom" min="1.1" max="4" step="0.1">
    <div class="label">Umbral de negro <span id="tv">26</span></div>
    <input type="range" id="threshold" min="8" max="60" step="1">
  </section>

  <div class="hint">⇪ Bloq Mayús (en pantalla completa): Zoom → Estirar → Ajustar → Desactivado</div>
  <button id="redo">Redetectar este video</button>
  <footer id="status">Buscando video…</footer>
  <script src="popup.js"></script>
</body>
</html>
