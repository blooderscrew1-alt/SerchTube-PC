<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Satellite Wi-Fi / Radio Waves (Echoing Remote Node Sync) -->
  <path d="M 176 130 A 150 150 0 0 1 336 130" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" stroke-opacity="0.5" />
  <path d="M 210 165 A 100 100 0 0 1 302 165" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Center Glowing Badge -->
  <circle cx="256" cy="275" r="145" fill="#18181b" stroke="#3f3f46" stroke-width="3" />
  <circle cx="256" cy="275" r="125" fill="url(#redGlow)" filter="url(#neonShadow)" />

  <!-- Dynamic Play / SerchTube Symbol with Equalizer Bars -->
  <polygon points="230,215 315,275 230,335" fill="#ffffff" />
  
  <!-- Mini Signal / Satellite Dot -->
  <circle cx="256" cy="195" r="10" fill="#ffffff" />

  <!-- Equalizer waves underneath -->
  <rect x="195" y="375" width="10" height="28" rx="5" fill="#ef4444" />
  <rect x="220" y="360" width="10" height="43" rx="5" fill="#f87171" />
  <rect x="245" y="350" width="10" height="53" rx="5" fill="#ffffff" />
  <rect x="270" y="365" width="10" height="38" rx="5" fill="#f87171" />
  <rect x="295" y="375" width="10" height="28" rx="5" fill="#ef4444" />
</svg>
