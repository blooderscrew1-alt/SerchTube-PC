    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!--
      AUTO-SANEADO (imprescindible): esta app NO registra ningún service worker, pero en
      navegadores que ya la usaron puede quedar uno viejo de una compilación anterior. Ese
      service worker sirve un index.html antiguo que pide un assets/index-<hash>.js que ya
      no existe -> la pantalla se queda BLANCA (con el título visible) en cualquier PC.
      Aquí se desregistran esos service workers, se borran sus cachés y se recarga una vez
      para que la página se sirva directamente del servidor. Es idempotente y silencioso.
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        try {
          navigator.serviceWorker.getRegistrations().then(function (registros) {
            if (!registros || registros.length === 0) return;
            Promise.all(registros.map(function (r) { return r.unregister(); }))
              .then(function () {
                var limpiar = (window.caches && caches.keys)
                  ? caches.keys().then(function (claves) {
                      return Promise.all(claves.map(function (k) { return caches.delete(k); }));
                    })
                  : Promise.resolve();
                return limpiar;
              })
              .then(function () {
                var clave = 'serchtube_sw_limpiado';
                if (!sessionStorage.getItem(clave)) {
                  sessionStorage.setItem(clave, '1');
                  location.reload();
                }
              })
              .catch(function () {});
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-black text-zinc-100 antialiased selection:bg-red-600/30 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
